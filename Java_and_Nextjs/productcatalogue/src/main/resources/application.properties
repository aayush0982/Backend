spring.application.name=ProductCatalogue

spring.datasource.url=jdbc:postgresql://localhost:5432/FULLSTACKJAVADB
spring.datasource.username=postgres
spring.datasource.password=1234567890

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create

server.port=8087

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Application logging
logging.level.root=INFO
logging.level.com.cg.productcatalogue=DEBUG

# Write logs to both console and file
logging.file.name=logs/productcatalogue.log

# Keep SQL logs manageable
logging.level.org.hibernate.SQL=WARN