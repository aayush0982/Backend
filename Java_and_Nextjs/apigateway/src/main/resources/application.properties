spring.application.name=Apigateway

server.port=8088



spring.cloud.gateway.server.webflux.discovery.locator.enabled=true


# =========================
# CATEGORY SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=category
spring.cloud.gateway.server.webflux.routes[0].uri=lb://Category
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/category/**


# =========================
# INVENTORY SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[1].id=inventory
spring.cloud.gateway.server.webflux.routes[1].uri=lb://Inventory
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/productinventory/**


# =========================
# PRODUCT SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[2].id=product
spring.cloud.gateway.server.webflux.routes[2].uri=lb://Product
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**


# =========================
# PRODUCT CATALOGUE SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[3].id=product-catalogue
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ProductCatalogue
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/**


# =========================
# RECOMMENDATION SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[4].id=recommendation
spring.cloud.gateway.server.webflux.routes[4].uri=lb://Recommendation
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/recommendation/**


# =========================
# USER SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[5].id=user
spring.cloud.gateway.server.webflux.routes[5].uri=lb://User
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/user/**